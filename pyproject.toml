[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["cli"]

[project]
name = "bedrock-api"
version = "0.1.0"
description = "Admin CLI and Lambda proxy for AWS Bedrock access management"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "moto[dynamodb,s3]>=5.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
bedrock-api = "bedrock_api.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
